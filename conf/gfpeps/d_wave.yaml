params:
  Nv: 2 # Number of virtual fermions on each bond
  seed: 45 # Random seed

lattice:
  Lx: 101 # System size in x-direction
  Ly: 101 # System size in y-direction

hamiltonian:
  ht: 1.0 # Hoping amplitude
  DeltaX: 0.0 # d-wave pairing amplitude in x-direction
  DeltaY: 0.0 # d-wave pairing amplitude in y-direction
  delta: 0.0 # desity of holes
  Mu: 0.0 # chemical potential
  solve_mu_from_delta: false # whether to solve chemical potential from hole density
  pairing_type: "d_wave" # d-wave pairing (nodal)

file:
  # LoadFile: "./data/d_wave.h5" # Load initial T from this file, if it exists
  LoadFile: ""
  WriteFile: "./data/d_wave.h5" # Write information about final Gaussian fPEPS to this file
  SaveEachSteps: True

optimizer:
  MaxIter: 100
  gtol: 1E-7 # gtol for optimizer

backend: gpu 