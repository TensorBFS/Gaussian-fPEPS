params:
  Nv: 2 # Number of virtual fermions on each bond
  seed: 44 # Random seed

lattice:
  Lx: 101 # System size in x-direction
  Ly: 101 # System size in y-direction

hamiltonian:
  ht: 1.0 # Hoping amplitude
  DeltaX: 0.5 # s-wave pairing amplitude (constant)
  DeltaY: 0.0 # not used for s-wave
  delta: 0.0 # desity of holes
  Mu: 0.0 # chemical potential
  solve_mu_from_delta: false # whether to solve chemical potential from hole density
  pairing_type: "s_wave" # s-wave pairing

file:
  LoadFile: "./data/s_wave.h5" # Load initial T from this file, if it exists
  # LoadFile: ""
  WriteFile: "./data/s_wave.h5" # Write information about final Gaussian fPEPS to this file
  SaveEachSteps: False

optimizer:
  MaxIter: 100
  gtol: 1E-7 # gtol for optimizer

backend: gpu 