[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kitaev-fpeps"
description = "Kitaev honeycomb spin-1/2 model using Gaussian fermionic PEPS"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["quantum", "kitaev", "majorana", "fpeps", "condensed-matter"]
authors = [
  { name = "Your Name", email = "your.email@example.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "jax>=0.4.0",
  "jaxlib>=0.4.0", 
  "pymanopt>=2.0.0",
  "numpy>=1.20.0",
  "matplotlib>=3.5.0",
  "scipy>=1.7.0",
  "seaborn>=0.11.0",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
  "pytest>=6.0",
  "pytest-cov",
]
gpu = [
  "jax[cuda]",
]

[project.urls]
Documentation = "https://github.com/username/kitaev-fpeps#readme"
Issues = "https://github.com/username/kitaev-fpeps/issues"
Source = "https://github.com/username/kitaev-fpeps"

[project.scripts]
kitaev = "main:main"

[tool.hatch.version]
path = "__about__.py"

[tool.hatch.envs.default]
dependencies = [
  "pytest",
  "pytest-cov",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov=src {args:tests}"
cov-report = ["test-cov", "coverage report"]

[[tool.hatch.envs.all.matrix]]
python = ["3.8", "3.9", "3.10", "3.11", "3.12"]

[tool.hatch.envs.types]
dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/gfpeps tests}"

[tool.coverage.run]
source_pkgs = ["gfpeps", "tests"]
branch = true
parallel = true
omit = [
  "src/gfpeps/__about__.py",
]

[tool.coverage.paths]
gfpeps = ["src/gfpeps", "*/gfpeps/src/gfpeps"]
tests = ["tests", "*/gfpeps/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
